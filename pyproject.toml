[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armwrestling-simulator"
version = "0.1.0"
description = "Faithful 2-DOF arm-wrestling biomechanics simulator (elbow + forearm, coupled wrists)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

# The science code is a working directory, not a package — nothing to install.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["biomechanics_simulator"]
testpaths = ["biomechanics_simulator/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
